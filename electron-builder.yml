appId: com.reconix.app
productName: Reconix
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  # Bundled OpenCode standalone binary (downloaded by scripts/download-opencode.mjs
  # during CI). Copilot's resolveOpenCodeBinary() checks these paths first,
  # falling back to PATH. Windows has no standalone binary published, so only
  # Linux and macOS entries exist here.
  - from: "resources/opencode-linux/opencode"
    to: "opencode/linux/opencode"
  - from: "resources/opencode-mac/opencode"
    to: "opencode/mac/opencode"
  # Runtime config/assets read via app.getAppPath() at runtime. glob patterns
  # (no leading ./) so electron-builder resolves them from the project root on
  # every platform.
  - opencode.json
  - .opencode/agents/*.md
  - .opencode/tools/z3_string_solver.py
  # Engagement instructions (optional; copilot.ts tolerates its absence).
  - AGENTS.md
  # NOTE: reconix.env is intentionally NOT bundled — it is user-specific
  # (remote vLLM URL + key). copyEnv-style readers already handle its absence.
asar: true
# The z3 solver is handed to an external `python` process, which cannot read
# inside an asar archive, so keep a real file on disk.
asarUnpack:
  - .opencode/tools/z3_string_solver.py
# no native modules, so there is nothing to rebuild
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Discord-like distribution: build artifacts are uploaded as GitHub Releases.
# Replace `owner` with the real org/user once the repo is public.
publish:
  provider: github
  owner: makaip
  repo: reconix
  releaseType: release
  # Never publish implicitly on `electron-builder` runs; use `--publish always`
  # (or the dist:* scripts) explicitly to upload.
  publishAutoUpdate: false

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]

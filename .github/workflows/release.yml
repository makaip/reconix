name: Release

# Builds and publishes a GitHub Release (with auto-update metadata) whenever a
# version tag is pushed. Each OS runner produces its own installer; electron-
# builder uploads them all to the same release, so the in-app auto-updater
# (electron-updater) can pick the right artifact per platform.
#
# Usage:
#   git tag v0.0.2 && git push origin v0.0.2
#
# The version comes from package.json — bump it before tagging.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight
        run: node scripts/preflight.mjs

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

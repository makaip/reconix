[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconix"
version = "0.1.0"
description = "Agentic topology test harness for the AI penetration testing browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.4",
    "z3-solver>=4.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

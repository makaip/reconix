<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Dev CSP. electron-vite's HMR needs inline styles, so this keeps
      style-src 'unsafe-inline'. Production gets a strict no-'unsafe-inline'
      policy via an onHeadersReceived header in src/main/index.ts; both apply
      in prod and the browser takes the intersection (the strict header wins).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Reconix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
